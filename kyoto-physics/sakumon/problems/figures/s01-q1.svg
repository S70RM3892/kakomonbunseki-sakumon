<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" font-family="IPAGothic, sans-serif" font-size="15">
  <rect width="460" height="250" fill="#fff"/>
  <!-- floor -->
  <line x1="20" y1="215" x2="440" y2="215" stroke="#000" stroke-width="2"/>
  <g stroke="#000" stroke-width="1">
    <line x1="40" y1="215" x2="30" y2="227"/><line x1="90" y1="215" x2="80" y2="227"/><line x1="140" y1="215" x2="130" y2="227"/>
    <line x1="190" y1="215" x2="180" y2="227"/><line x1="240" y1="215" x2="230" y2="227"/><line x1="290" y1="215" x2="280" y2="227"/>
    <line x1="340" y1="215" x2="330" y2="227"/><line x1="390" y1="215" x2="380" y2="227"/><line x1="435" y1="215" x2="425" y2="227"/>
  </g>
  <!-- wall -->
  <rect x="48" y="20" width="22" height="195" fill="#bbb" stroke="#000" stroke-width="1.5"/>
  <text x="46" y="15">壁</text>
  <!-- block with semicircular groove: O=(210,70), R=110 -->
  <path d="M70 70 L100 70 A110 110 0 0 0 320 70 L350 70 L350 215 L70 215 Z" fill="#e8e8e8" stroke="#000" stroke-width="2"/>
  <text x="300" y="205">台(質量 M)</text>
  <!-- O, P, A, B -->
  <circle cx="210" cy="70" r="2.5" fill="#000"/>
  <text x="204" y="60">O</text>
  <text x="96" y="60">A</text><text x="316" y="60">B</text>
  <text x="204" y="200">P</text>
  <line x1="100" y1="70" x2="320" y2="70" stroke="#000" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="210" y1="70" x2="210" y2="180" stroke="#000" stroke-width="1" stroke-dasharray="5 4"/>
  <!-- ball at theta=35deg right: contact point (210+110 sin35, 70+110 cos35)=(273.1,160.1); ball r=8 center at radius 102 -->
  <line x1="210" y1="70" x2="268.5" y2="153.6" stroke="#000" stroke-width="1"/>
  <circle cx="268.5" cy="153.6" r="8" fill="#000"/>
  <text x="282" y="150">小球(質量 m)</text>
  <path d="M210 110 A40 40 0 0 0 232.9 102.8" fill="none" stroke="#000" stroke-width="1"/>
  <text x="216" y="128">θ</text>
  <text x="252" y="108">R</text>
  <!-- g arrow -->
  <line x1="410" y1="60" x2="410" y2="110" stroke="#000" stroke-width="1.5"/>
  <path d="M410 116 L405 104 L415 104 Z" fill="#000"/>
  <text x="418" y="92">g</text>
</svg>
